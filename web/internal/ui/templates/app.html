{{define "app"}}
<div id="app" class="app-shell">
  <form
    id="crafting-form"
    hx-post="/crafting"
    hx-target="#app"
    hx-swap="outerHTML"
    hx-trigger="change delay:150ms"
    hx-indicator="#saving"
    hx-scroll="false"
  >
    {{template "controls" .}}
    <div class="toolbar">
      <span id="saving" class="htmx-indicator">Updating…</span>
    </div>

    {{template "results" .}}
  </form>
</div>
{{end}}
